name: Docker Publish Frontend

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/binhphanbp/upnext-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            {
              echo "api_url=https://api.upnext.works"
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:production"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            {
              echo "api_url=https://api-staging.upnext.works"
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:staging"
              echo "${IMAGE_NAME}:develop"
              echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.vars.outputs.api_url }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.vars.outputs.api_url }}
            NEXT_PUBLIC_API_MOCKING=disabled
