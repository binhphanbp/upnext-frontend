name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Do not rename. The `protect-develop` and `protect-main` rulesets require a status
    # check whose context is this exact string, and a required context that never reports
    # blocks every pull request indefinitely rather than failing them — so a rename here
    # takes the repository down until someone with admin rights edits the ruleset. Adding
    # steps to this job is free; changing its name is not. The e2e run lives below.
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The end-to-end suite existed and was never run by this pipeline, so the checks a
      # reviewer assumed were protecting the app were not running at all. It caught a blank
      # CV export that unit tests structurally cannot see: the failure lived in a print
      # media query, which only exists once a real browser lays the page out on paper.
      # It runs after Build because the suite serves the standalone output, not a dev server.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
