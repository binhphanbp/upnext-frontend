name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Do not rename. The `protect-develop` and `protect-main` rulesets require a status
    # check whose context is this exact string, and a required context that never reports
    # blocks every pull request indefinitely rather than failing them — so a rename here
    # takes the repository down until someone with admin rights edits the ruleset. Adding
    # steps to this job is free; changing its name is not. The e2e run lives below.
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The end-to-end suite existed and was never run by this pipeline, so the checks a
      # reviewer assumed were protecting the app were not running at all. It caught a blank
      # CV export that unit tests structurally cannot see: the failure lived in a print
      # media query, which only exists once a real browser lays the page out on paper.
      # It runs after Build because the suite serves the standalone output, not a dev server.
      #
      # Browsers are cached across runs, keyed on the version pinned in the lockfile: without
      # this, every run re-downloaded Chromium from scratch, which is normally ~30s but once
      # hung on a slow runner until the job's 45-minute ceiling killed it -- after typecheck,
      # lint, format, test and build had all already passed.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # `--with-deps` also installs the OS packages Chromium needs (fonts, codecs) and is
      # skipped above on a cache hit, since it would otherwise still hit the network for
      # those every run. `install-deps` covers just that half, cheaply, every time.
      - name: Install Playwright OS dependencies
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
